  # The FX venues and our own derived inverse series trade continuously, so
  # they contribute no venue close of their own — only the fx_rollover above.
  FX:
    timezone: America/New_York
    continuous: true
    thin_hours_local: []
    bars_observed: 28986
    confidence: high

  FX_IDC:
    timezone: America/New_York
    continuous: true
    thin_hours_local: []
