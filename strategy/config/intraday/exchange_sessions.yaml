  DERIVED:
    timezone: America/New_York
    continuous: true
    thin_hours_local: []
    bars_observed: 34661
    confidence: high

# A venue that is not listed above. Refusing to trade is the only safe
# default: silently treating an unknown venue as always-open is exactly how a
# position ends up held overnight, which is the thing this file exists to
# prevent.
unknown_venue_policy: refuse_entry
