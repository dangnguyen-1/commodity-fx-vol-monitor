# Per-venue trading sessions, used to enforce the spec's
# `sessions.allow_overnight_positions: false` and
# `sessions.block_new_entries_before_market_close_minutes`.
#
# WHERE THESE NUMBERS COME FROM
# -----------------------------
# Every close/open time below was derived from our own 1-minute bars rather
# than transcribed from an exchange website or from memory. Method: for each
# venue, take all weekday 1-minute bars, find the minutes of the day that
# never carry a bar, and take the longest contiguous run of those. The minute
# before that run is the session close; the minute after it is the reopen.
# Times are then expressed in the venue's own timezone so that daylight-saving
# transitions are handled by the tz database instead of drifting an hour twice
# a year.
#
# The derivation reproduces well-known exchange behaviour, which is the main
# reason to trust it: COMEX and NYMEX come out at 16:59 close / 18:00 reopen
# (the CME daily maintenance break), CBOT at 14:19 (grains settle 13:20 CT),
# ICEUS at 14:19, AMEX at 09:30-15:59 (US cash equity hours). None of that was
# put in by hand.
#
# WHAT THIS DOES NOT MODEL
# ------------------------
# Holidays. There is no holiday calendar here, and deliberately so: on a
# holiday no bars arrive, and every engine path already requires a completed
# bar before it will enter or mark a position. A missing session therefore
# degrades into "no trading" on its own. That is a safe failure, not a
# silent one, but it does mean this file must not be read as a statement
# about which days an exchange is open.
#
# CONFIDENCE
# ----------
# `bars_observed` is how much evidence each venue's numbers rest on. ICEEUR
# and ABAXX are thin enough to be worth re-deriving once more history has
# accumulated; they are marked `confidence: low` and should be reviewed
# before anything trades size against them.

version: 2

# Hours inside a session where the venue barely trades. Entering then means
# crossing a wider spread into a book that cannot absorb the exit, which is
# a cost the fill model's flat fallback bps does not see.
#
# Derived the same way as the session times, and from the same principle:
# measured from each venue's own volume rather than assumed. For each venue,
# total volume per hour of the day across weekdays; any hour below
# `thin_hour_volume_fraction` of that venue's own median active hour is
# thin. Listed in venue-local time so the tz database handles daylight
# saving, exactly as the close/open times are.
#
# Most of what this catches sits right at a session edge, which the
# pre-close blackout already covers. The hours worth having are the ones in
# the middle -- RUS just after its open, for instance. So this is a genuine
# but modest addition, not a large new filter.
liquidity:
  thin_hour_volume_fraction: 0.05
  derived_from: weekday volume per hour of day, per venue
  action: suppress_new_entries

version_history:
  1: Session open/close times, derived from bar coverage.
  2: Added per-venue thin-liquidity hours, derived from volume.

derivation:
  source: market_data (1-minute bars)
  filter: weekdays only (ISO day-of-week 1-5)
  method: longest contiguous run of minutes carrying no bars
  derived_on_utc: "2026-08-31"

# The FX leg is what the strategy actually holds, and it trades around the
# clock — so it has no session close of its own to key off. What it does have
# is the 17:00 New York interbank rollover, which is also when the trading day
# is conventionally considered to turn over and when the weekend break starts
# on a Friday. That is the FX leg's contribution to the flat deadline.
fx_rollover:
  timezone: America/New_York
  time: "17:00"

venues:
  COMEX:
    timezone: America/New_York
    close: "16:59"
    open: "18:00"
    thin_hours_local: []
    bars_observed: 24893
    confidence: high

  NYMEX:
    timezone: America/New_York
    close: "16:59"
    open: "18:00"
    thin_hours_local: []
